services:
  steefmin-portfolio:
    image: ghcr.io/steefmin/steefmin.xyz:latest
    container_name: steefmin-portfolio
    restart: unless-stopped
    networks:
      - proxy
    labels:
      # Enable Traefik
      - "traefik.enable=true"
      
      # HTTP Router - redirect to HTTPS
      - "traefik.http.routers.steefmin-http.rule=Host(`steefmin.xyz`)"
      - "traefik.http.routers.steefmin-http.entrypoints=web"
      - "traefik.http.routers.steefmin-http.middlewares=https-redirect"
      
      # HTTPS Router
      - "traefik.http.routers.steefmin-https.rule=Host(`steefmin.xyz`)"
      - "traefik.http.routers.steefmin-https.entrypoints=websecure"
      - "traefik.http.routers.steefmin-https.tls=true"
      - "traefik.http.routers.steefmin-https.tls.certresolver=le"
      
      # Service
      - "traefik.http.services.steefmin.loadbalancer.server.port=80"
      
      # Middleware for HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

networks:
  proxy:
    external: true
